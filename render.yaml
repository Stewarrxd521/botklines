services:
  - type: web
    name: bot-kline
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    # gthread: hilos reales para la web; 1 proceso (el bot vive dentro de él).
    startCommand: >-
      gunicorn app:app
      --bind 0.0.0.0:$PORT
      --worker-class gthread
      --workers 1
      --threads 8
      --timeout 0
      --keepalive 65
      --log-level info

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.13"

      # ── Estrategia ──────────────────────────────────────────────────────────
      # Bot al cierre (vela 1m cerrada)
      - key: SIGNAL_THRESHOLD_PCT
        value: "3"            # cuerpo mínimo de la última vela 1m (sube → LONG, baja → SHORT)
      - key: TAKE_PROFIT_PCT
        value: "2"            # cierra al avanzar este % a favor. Sin stop loss.
      # Bot en vivo (vela 1m en curso, entra sin esperar al cierre)
      - key: LIVE_SIGNAL_THRESHOLD_PCT
        value: "3"
      - key: LIVE_TAKE_PROFIT_PCT
        value: "2"
      - key: INVERT_SIGNALS
        value: "false"        # true = contra la vela y el % es stop loss (también con el botón de la web)
      - key: FEE_PCT
        value: "0.05"         # comisión por lado que se resta al PnL
      - key: PROFIT_TARGET_USD
        value: "12"           # realizado + abierto con el que se cierra todo (0 = apagado)
      - key: MAX_OPEN_POSITIONS
        value: "0"            # límite inicial de posiciones abiertas, los dos bots (0 = sin límite)
      - key: NOTIONAL_USDT
        value: "5"            # USDT por entrada
      - key: COOLDOWN_SECONDS
        value: "0"            # pausa tras cerrar antes de volver a operar el símbolo

      # ── Bot de ratio: salida por precio (editable en caliente desde la web) ──
      - key: RATIO_TP_PCT
        value: "10"           # take profit: +10 % a favor desde la entrada (0 = sin TP)
      - key: RATIO_SL_PCT
        value: "5"            # stop loss: -5 % en contra desde la entrada (0 = sin SL)
      - key: RATIO_EXIT_BY_RATIO
        value: "true"         # además, TP cuando el ratio recupera el % que cayó

      # ── Ancho de banda ──────────────────────────────────────────────────────
      - key: TICKER_MODE
        value: "rest"         # 24 h con 1 petición gzip cada 5 min (ws = WebSocket continuo, ~80 KB/s)
      - key: STATUS_POLL_MS
        value: "3000"         # cada cuánto consulta el panel (solo con la pestaña visible)

      # ── Executor (las órdenes las abre el executor) ─────────────────────────
      # El link se puede cambiar en caliente desde la web; esto es el valor inicial.
      - key: EXECUTOR_URL
        value: "https://executor-5lu0.onrender.com"
      - key: EXECUTOR_SECRET
        sync: false
      - key: ADMIN_TOKEN
        sync: false           # si se define, cambiar el executor o cerrar desde la web lo exige

      # ── Velas (WebSocket, sin REST) ─────────────────────────────────────────
      - key: KLINE_HISTORY
        value: "2"            # última y penúltima vela cerrada por símbolo
      - key: KLINE_DTYPE
        value: "float64"

      # ── REST: solo exchangeInfo al arrancar (filtros de cantidad) ───────────
      - key: REST_PROXY_URL
        sync: false
      - key: SYMBOL_REFRESH_HOURS
        value: "12"
      - key: BASE_URL
        value: "https://fapi.binance.com"
      - key: QUOTE_ASSET
        value: "USDT"

